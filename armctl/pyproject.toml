[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armctl"
version = "0.1.0"
description = "Host driver for the VLA arm controller board (protocol v1), kinematics, safety, teleop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyserial>=3.5", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
# LeRobot Robot/Teleoperator plugins (armctl.lerobot); API matched against 0.7.0
lerobot = ["lerobot>=0.7,<0.8"]
# independent FK/Jacobian cross-check (tests/test_crosscheck.py)
crosscheck = ["pin>=3", "ikpy>=3.4"]

[project.scripts]
armctl-ping = "armctl.cli:ping_main"
armctl-teleop = "armctl.cli:teleop_main"
armctl-lerobot-record = "armctl.lerobot.scripts:record_main"
armctl-lerobot-teleoperate = "armctl.lerobot.scripts:teleoperate_main"

[tool.setuptools]
packages = ["armctl", "armctl.lerobot"]

[tool.setuptools.package-data]
armctl = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
